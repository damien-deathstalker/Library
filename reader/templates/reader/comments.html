{% load text %}
{% if comments %}
<ol class="comment-list">
    {% for comment in comments %}
    <li class="comment">
        <p class="comment__by">{{ comment.name }}</p>
        <div class="comment__body">{{ comment.comment_post|paragraphs }}</div>
    </li>
    {% endfor %}
</ol>
{% else %}
<p class="comments__empty">No comments on this chapter yet. Be the first to say what you thought.</p>
{% endif %}
